<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitewise</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/mypage.css">
</head>

<body>

    {% include 'nav.html' %}

    <div class="mypage-grid">
        {% with messages = get_flashed_messages()%}
        {% if messages%}
        {% for message in messages%}
        <p class="error-message">{{message}}</p>
        {%endfor%}
        {%endif%}
        {%endwith%}

        <div class="fridge-box">
            <div class="fridge-list">
                <h3>Fridge Items:</h3>
                <div class="fridge-items" id="fridgeItems">
                </div>
            </div>

            <div class="add-to-fridge">
                <div class="add-to-fridge-box">
                    <form name="addToFrigde" action="/addIngredient" class="fridge-form" id="frigdeForm" method="post">
                        <label for="type">Type</label><br>
                        <div id="radioTypes">

                        </div>
                        <label for="amount">Amount</label>
                        <input type="text" name="amount" id="amount"><br>
                        <label for="bestBeforeDate">Best before date</label>
                        <input type="text" name="bestBeforeDate" id="bestBeforeDate"><br>
                        <input type="submit" name="submit" id="fridge-submit">
                        <input name="grant_type" type="hidden" value="password">
                    </form>
                </div>
            </div>
        </div>

        <div class="meal-box">

            <!-- Meal plans -->
            <div class="all-meal-plans">
                <h3>Meal Plans</h3>

                <div class="meal-plan-list" id="mealPlanList">
                    <form name="addMealPlan" action="/addMealPlan" class="meal-plan-form" id="mealPlanForm"
                        method="post">
                        <label for="targetCalories">Target Calories</label>
                        <input type="text" name="targetCalories" id="targetCalories"><br>
                        <label for="targetProtein">Target Protein</label>
                        <input type="text" name="targetProtein" id="targetProtein"><br>
                        <input type="submit" name="submit" id="meal-plan-submit">
                    </form>
                </div>
            </div>


            <!-- 7 day schedule -->
            <div class="meal-days-box">
                <h3>7 Day Schedule</h3>
                <div class="meal-days" id="mealDays"></div>


                <!-- ONE total for the schedule -->

                <div class="meal-week-total">

                    <div class="meal-week-total-item">
                        <span class="meal-week-total-label">
                            Calories
                        </span>

                        <span class="meal-week-total-value" id="totalCalories">
                        </span>
                    </div>

                    <div class="meal-week-total-item">
                        <span class="meal-week-total-label">
                            Protein
                        </span>

                        <span class="meal-week-total-value" id="totalProtein">
                        </span>
                    </div>

                </div>
                <div class="meal-days" id="mealDays"></div>
            </div>


            <!-- Add recipe box -->
            <div class="meal-controls-box">
                <h3>Add Meal</h3>

                <label for="mealPlanSelect">Meal Plan</label>
                <select id="mealPlanSelect">
                </select>

                <label for="recipeSelect">Recipe</label>
                <select id="recipeSelect">
                </select>

                <label for="mealDate">Day</label>
                <select id="daySelect">
                    <option value="monday">Monday</option>
                    <option value="tuesday">Tuesday</option>
                    <option value="wednesday">Wednesday</option>
                    <option value="thursday">Thursday</option>
                    <option value="friday">Friday</option>
                    <option value="saturday">Saturday</option>
                    <option value="sunday">Sunday</option>
                </select>

                <button id="addMeal">
                    Add Meal
                </button>
            </div>

        </div>
    </div>

    {% include 'footer.html' %}

    <script src="/static//mealPlans.js" async></script>
    <script src="/static//getData.js"></script>
</body>

</html>
